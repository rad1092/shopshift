name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopshift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-package:
    name: ${{ matrix.os }} tests and installed app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CONCURRENT_DOWNLOADS: '2'
      UV_CONCURRENT_BUILDS: '1'
      UV_CONCURRENT_INSTALLS: '2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12.13'
          enable-cache: true
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0t64 libcups2t64 libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 fonts-noto-cjk
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python 3.12.13
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Linux Qt loader preflight
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build
          ldd .venv/lib/python3.12/site-packages/PySide6/Qt/plugins/platforms/libqxcb.so | tee build/linux-qt-dependencies.txt
          QT_DEBUG_PLUGINS=1 xvfb-run -a uv run --no-sync python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt platform:', app.platformName())" 2>&1 | tee build/linux-qt-preflight.log
      - name: Tests (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync pytest -q --junitxml=build/test-results.xml
      - name: GUI smoke (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync python -m shopshift --smoke-test build/source-smoke
      - name: Tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: uv run --no-sync pytest -q --junitxml=build/test-results.xml
      - name: GUI smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: uv run --no-sync python -m shopshift --smoke-test build/source-smoke
      - name: Build, install from archive, launch and clean wheel install (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync python scripts/build_release.py --test-wheel
      - name: Build, install from archive, launch and clean wheel install (Windows and macOS)
        if: runner.os != 'Linux'
        run: uv run --no-sync python scripts/build_release.py --test-wheel
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            build/test-results.xml
            build/linux-qt-dependencies.txt
            build/linux-qt-preflight.log
            build/external-system-libraries.json
            build/source-smoke/
            build/release-smoke/
            build/release-licenses/manifest.json
            build/pyinstaller/shopshift/warn-shopshift.txt
          if-no-files-found: warn
          retention-days: 14
